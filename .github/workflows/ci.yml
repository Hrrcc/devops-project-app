name: Build and Security Scan

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t ticketing-api:ci ./api

      - name: Build frontend image
        run: docker build -t ticketing-frontend:ci ./frontend

      - name: Build worker image
        run: docker build -t ticketing-worker:ci ./worker

      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ticketing-api:ci
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ticketing-frontend:ci
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Scan worker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ticketing-worker:ci
          severity: CRITICAL,HIGH
          exit-code: "0"