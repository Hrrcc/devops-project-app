apiVersion: v1
kind: ServiceAccount
metadata:
  name: ticketing-service-account
  namespace: ticketing

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ticketing-read-role
  namespace: ticketing
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - secrets
      - services
    verbs:
      - get
      - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ticketing-read-binding
  namespace: ticketing
subjects:
  - kind: ServiceAccount
    name: ticketing-service-account
    namespace: ticketing
roleRef:
  kind: Role
  name: ticketing-read-role
  apiGroup: rbac.authorization.k8s.io